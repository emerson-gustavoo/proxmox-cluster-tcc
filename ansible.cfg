[defaults]
inventory            = inventory.yml
roles_path           = roles
host_key_checking    = False
interpreter_python   = auto_silent
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
forks                = 10
timeout              = 30
retry_files_enabled  = False

# host_key_checking desabilitado de proposito: os nos sao reprovisionados
# varias vezes pelo MAAS e a host key muda a cada deploy. Decisao de
# laboratorio -- registrar como tal no texto do TCC2.

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15

[privilege_escalation]
become        = True
become_method = sudo
