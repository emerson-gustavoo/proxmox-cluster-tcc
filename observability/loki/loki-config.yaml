# Loki em modo monolitico -- adequado a laboratorio, nao a producao.
# Registrar essa limitacao no texto do TCC2.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Provisionamento gera picos curtos de log; folga evita descarte
  # justamente na janela que interessa observar (formacao do quorum).
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  reject_old_samples: false
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: false
